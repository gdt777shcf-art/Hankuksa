<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한국사 암기장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>한국사 암기장</title>
<style>html{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@600;700;800&display=swap">
<style>
/* 레이아웃: 하단 탭 4개. 문제 풀이 중에는 탭을 숨기고 상단 진행 막대 + 하단 고정 버튼 바만 남기는 집중 화면.
   쪽빛 파랑 주조에 다홍 포인트, 눌리는 입체 버튼. 숫자는 Outfit, 사료 원문만 명조 '자료' 박스. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EEF1F6; --line:#E1E5EE;
  --ink:#131A2B; --muted:#69738A;
  --accent:#2F5BEA; --accent-deep:#2145C2; --accent-soft:#E7EDFF; --accent-ink:#FFFFFF;
  --hero:#2F5BEA; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.26); --hero-btn:#FFFFFF; --hero-btn-ink:#2145C2; --hero-btn-sh:rgba(10,20,70,.28);
  --gold:#D9580B; --gold-bg:#FFF1E4; --sun:#F5A300;
  --good:#0E9347; --good-deep:#0A7437; --good-bg:#E3F6EA; --good-ink:#0B6B34; --on-good:#FFFFFF;
  --bad:#E5484D; --bad-deep:#C0353A; --bad-bg:#FDECEC; --bad-ink:#B4282D; --on-bad:#FFFFFF;
  --mark:#FFE98A; --on-uc:#FFFFFF; --scrim:rgba(13,17,28,.5);
  --u1:#2F5BEA;--u2:#0B8F9C;--u3:#D6336C;--u4:#D97706;--u5:#7048E8;--u6:#0E9347;--u7:#C2410C;--u8:#55657F;
  --display:"Outfit","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:"Gowun Batang","Noto Serif KR",serif; --mono:var(--display);
  --r:18px; --shadow:0 1px 2px rgba(19,26,43,.04),0 10px 26px -14px rgba(19,26,43,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D111C; --surface:#161B2A; --surface2:#1F2638; --line:#2A3247;
  --ink:#EEF1F8; --muted:#99A3BD;
  --accent:#5C80FF; --accent-deep:#3F60DB; --accent-soft:#1D2748; --accent-ink:#FFFFFF;
  --hero:#2A3C92; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.2); --hero-btn:#FFFFFF; --hero-btn-ink:#2145C2; --hero-btn-sh:rgba(0,0,0,.4);
  --gold:#FFA05C; --gold-bg:#2E2218; --sun:#FFC24D;
  --good:#34C177; --good-deep:#1F8F55; --good-bg:#12301F; --good-ink:#7BE3AB; --on-good:#06140C;
  --bad:#FF7A7F; --bad-deep:#D2555A; --bad-bg:#3A1A1D; --bad-ink:#FFA3A7; --on-bad:#1B0708;
  --mark:#6B5A12; --on-uc:#0D111C; --scrim:rgba(0,0,0,.6);
  --u1:#7C9BFF;--u2:#4FD1DC;--u3:#FF85AD;--u4:#FFB454;--u5:#A68BFF;--u6:#5ADB94;--u7:#FF9466;--u8:#A9B6D3;
  --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D111C; --surface:#161B2A; --surface2:#1F2638; --line:#2A3247;
  --ink:#EEF1F8; --muted:#99A3BD;
  --accent:#5C80FF; --accent-deep:#3F60DB; --accent-soft:#1D2748; --accent-ink:#FFFFFF;
  --hero:#2A3C92; --hero-ink:#FFFFFF; --hero-track:rgba(255,255,255,.2); --hero-btn:#FFFFFF; --hero-btn-ink:#2145C2; --hero-btn-sh:rgba(0,0,0,.4);
  --gold:#FFA05C; --gold-bg:#2E2218; --sun:#FFC24D;
  --good:#34C177; --good-deep:#1F8F55; --good-bg:#12301F; --good-ink:#7BE3AB; --on-good:#06140C;
  --bad:#FF7A7F; --bad-deep:#D2555A; --bad-bg:#3A1A1D; --bad-ink:#FFA3A7; --on-bad:#1B0708;
  --mark:#6B5A12; --on-uc:#0D111C; --scrim:rgba(0,0,0,.6);
  --u1:#7C9BFF;--u2:#4FD1DC;--u3:#FF85AD;--u4:#FFB454;--u5:#A68BFF;--u6:#5ADB94;--u7:#FF9466;--u8:#A9B6D3;
  --shadow:none; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
svg.ic{flex:none;display:block}
mark{background:var(--mark);color:inherit;padding:0 .15em;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:2px calc(96px + env(safe-area-inset-bottom,0px))}
/* 상단 바 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:10px;display:flex;align-items:center;gap:12px;min-height:60px}
.htitle{min-width:0;flex:1}
header.top h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
header.top .sub{font-size:.8rem;color:var(--muted);margin-top:1px}
header.top .sub:empty{display:none}
header.top .back{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);flex:none}
.hprog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.hprog .prog{flex:1;margin:0}
.hcount{font:700 .9rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
#hright{flex:none}
#hright:empty{display:none}
.streak{display:inline-flex;gap:4px;align-items:center;padding:7px 11px 7px 9px;border-radius:999px;background:var(--gold-bg);color:var(--gold);font:800 .9rem var(--display)}
.streak.off{background:var(--surface2);color:var(--muted)}
/* 하단 탭 */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bottom button{display:grid;justify-items:center;gap:2px;padding:8px 4px 9px;font-size:.72rem;font-weight:500;color:var(--muted);text-align:center}
nav.bottom .nic{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
nav.bottom button.on{color:var(--accent);font-weight:700}
nav.bottom button.on .nic{background:var(--accent-soft)}
body.focus nav.bottom{display:none}
/* 공통 */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:18px}
.stack{display:grid;gap:14px}
h2{font-family:var(--display);font-size:1.08rem;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
h3{font-size:.92rem;margin:0 0 4px;font-weight:700}
.sect{font:800 .95rem var(--display);margin:6px 2px -4px;display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:700}
.mono{font-family:var(--display);font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--muted)}
.yr{color:var(--gold);font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:11px 16px;border-radius:14px;font-weight:700;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);min-height:46px;text-align:center;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.btn.good{background:var(--good);color:var(--on-good);border-color:var(--good);box-shadow:0 3px 0 var(--good-deep)}
.btn.badb{background:var(--bad);color:var(--on-bad);border-color:var(--bad);box-shadow:0 3px 0 var(--bad-deep)}
.btn.white{background:var(--hero-btn);color:var(--hero-btn-ink);border-color:var(--hero-btn);box-shadow:0 3px 0 var(--hero-btn-sh)}
.btn.ghost{border-color:transparent;box-shadow:none;color:var(--accent);background:transparent}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.86rem;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:.86rem;font-weight:500;background:var(--surface);transition:background .12s,border-color .12s}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tag{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-right:4px;vertical-align:middle;white-space:nowrap}
.tag.u{color:var(--on-uc);background:var(--uc)}
.tag.ty{background:var(--accent-soft);color:var(--accent)}
.tag.star{color:var(--sun);letter-spacing:.05em;font-family:var(--display)}
.tag.neg{background:var(--bad-bg);color:var(--bad-ink)}
.tile{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--uc,var(--accent));color:var(--on-uc);font:800 1.05rem var(--display)}
.tile.soft{background:color-mix(in srgb,var(--uc,var(--accent)) 14%,var(--surface));color:var(--uc,var(--accent))}
.seg6{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;max-width:220px}
.seg6 i{height:6px;border-radius:3px;background:var(--surface2)}
.seg6 i.d{background:var(--uc,var(--good))}
.ringbox{position:relative;display:grid;place-items:center;flex:none}
.ringbox .rc{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1}
.ring .trk{stroke:var(--surface2)}.ring .val{stroke:var(--accent);transition:stroke-dashoffset .5s}
.ring.g .val{stroke:var(--good)}.ring.a .val{stroke:var(--sun)}.ring.b .val{stroke:var(--bad)}
/* 홈 */
.today{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;padding:20px;border-radius:22px;background:var(--hero);color:var(--hero-ink)}
.today .ring .trk{stroke:var(--hero-track)}.today .ring .val{stroke:var(--hero-ink)}
.today .rc b{font:800 1.9rem/1 var(--display)}.today .rc span{font:600 .78rem var(--display);opacity:.8;margin-top:3px}
.today .tinfo{display:grid;gap:3px;min-width:0;justify-items:start}
.today .eyebrow{color:inherit;opacity:.78}
.today .big{font:800 1.3rem/1.3 var(--display);letter-spacing:-.01em;text-wrap:balance}
.today .sub{font-size:.84rem;opacity:.85;margin-bottom:8px}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;padding-top:14px;border-top:1px solid var(--hero-track)}
.wd{display:grid;justify-items:center;gap:4px;font-size:.72rem;font-weight:500;opacity:.85}
.wd i{width:26px;height:26px;border-radius:50%;border:2px solid var(--hero-track);display:grid;place-items:center}
.wd.part i{background:var(--hero-track)}
.wd.full i{background:var(--hero-ink);border-color:var(--hero-ink);color:var(--hero)}
.wd.now{opacity:1;font-weight:800}.wd.now i{border-color:var(--hero-ink)}
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--gold-bg);width:100%}
.banner .tile{background:var(--gold);color:var(--on-uc)}
.banner b{display:block;font-family:var(--display);font-weight:800}
.banner .go{font:800 .86rem var(--display);color:var(--gold);display:flex;align-items:center}
.cont{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;color:var(--ink)}
.cont .ct{display:grid;min-width:0;gap:1px}
.cont .t{font:800 1.02rem/1.35 var(--display)}
.cont>svg{color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qab{display:grid;justify-items:center;gap:7px;padding:14px 4px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;font-size:.8rem;font-weight:700;line-height:1.25}
.qab small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:14px 14px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:2px}
.kpi b{font:800 1.45rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.74rem;color:var(--muted);font-weight:500}
.ulist{display:grid;gap:10px}
.urow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.urow .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--uc);color:var(--on-uc);font:800 1.1rem var(--display)}
.urow>span:nth-child(2),.trow>span:nth-child(2){display:grid;min-width:0;gap:2px}
.urow .t{font-size:.96rem;font-weight:700;line-height:1.35}
.urow .p{font-size:.75rem;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--uc,var(--good));width:0;transition:width .3s}
.urow .pct{font:800 .95rem var(--display);color:var(--uc);font-variant-numeric:tabular-nums}
/* 주제 목록 */
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.trow .no{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--uc) 14%,var(--surface));color:var(--uc);font:800 .95rem var(--display)}
.trow .t{font-size:.96rem;font-weight:700;line-height:1.35}
.trow .pg{font-size:.75rem;color:var(--muted)}
.trow br{display:none}
.dots{display:grid;grid-template-columns:repeat(4,10px);gap:3px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--surface2)}
.dots i.d{background:var(--uc,var(--good))}
/* 주제 허브 */
.hubhead{display:grid;gap:4px;padding:18px;border-radius:22px;background:color-mix(in srgb,var(--uc) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--uc) 22%,var(--surface))}
.hubhead .nm{font:800 1.25rem/1.3 var(--display);letter-spacing:-.01em;text-wrap:balance}
.hubhead .hh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hubhead .seg6{max-width:none;margin:8px 0 10px}
.hubhead .seg6 i:not(.d){background:color-mix(in srgb,var(--uc) 18%,var(--surface))}
.hubhead .btn{justify-self:start}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px;border-radius:16px;background:var(--surface2)}
.cat{display:grid;justify-items:center;gap:3px;padding:8px 0 7px;border-radius:12px;font-size:.78rem;font-weight:500;text-align:center;color:var(--muted)}
.cat.on{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(19,26,43,.12)}
.cat .ck{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-good)}
.cat .ck.d{background:var(--good);border-color:var(--good)}
.feat{display:grid;gap:12px}
.feat ul{margin:0;padding:0;display:grid;gap:8px}
.feat li{list-style:none;padding:12px 14px;border-radius:14px;background:var(--surface2);line-height:1.7;font-size:.96rem}
.trap{border:2px dashed color-mix(in srgb,var(--bad) 55%,transparent);border-radius:14px;padding:12px 14px;background:var(--bad-bg);font-size:.92rem;display:grid;gap:6px}
.trap b{color:var(--bad-ink);font-family:var(--display);font-weight:800}
.story{font-family:var(--serif);font-size:1.04rem;line-height:1.95;padding:16px 18px;border-radius:14px;background:var(--gold-bg)}
.story .cj{font-weight:700;color:var(--gold)}
.story .hd,.sumsec .hd{display:inline-block;min-width:3em;color:transparent;background:color-mix(in srgb,var(--gold) 28%,var(--surface));border-radius:6px;cursor:pointer;text-align:center;user-select:none}
.story .hd.show,.sumsec .hd.show{color:var(--ink);background:var(--mark)}
.quote{font-family:var(--serif);font-size:1rem;line-height:1.85;padding:18px 16px 14px;border:1.5px solid var(--line);outline:3px double var(--line);outline-offset:-7px;background:var(--surface);border-radius:4px;margin:6px 0 14px;max-height:42vh;overflow:auto;position:relative}
.quote::before{content:"자 료";position:absolute;top:-1px;left:12px;font:700 .66rem var(--body);letter-spacing:.3em;background:var(--surface);padding:0 6px;color:var(--muted);transform:translateY(-55%)}
.tl .e{display:grid;grid-template-columns:5.2em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem;align-items:baseline}
.tl .e:last-child{border-bottom:0}
.tl .e .y{font:700 .9rem var(--display);color:var(--gold);cursor:pointer;font-variant-numeric:tabular-nums;border-radius:6px;padding:1px 4px;justify-self:start}
.tl .e .y.hide{color:transparent;background:var(--surface2)}
.tl .e .p{color:var(--muted);font-size:.72rem;margin-left:6px;font-family:var(--display)}
.tl .e .m{color:var(--muted);font-size:.82rem;display:block}
.flip{min-height:220px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:22px;text-align:center;cursor:pointer}
.flip .face{font-size:1.12rem;line-height:1.6;font-weight:700;text-wrap:balance}
.flip .face.back{color:var(--accent);font-family:var(--display);font-size:1.25rem;font-weight:800}
.flip .lbl{font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.flip .q{font-family:var(--serif);font-size:1rem;line-height:1.8;text-align:left}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grade .btn.ng{border-color:var(--bad);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad)}
.grade .btn.ok{border-color:var(--good);color:var(--good-ink);box-shadow:0 3px 0 var(--good)}
/* 문제 풀이 */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:10px;gap:8px}
.qmeta{display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.prog{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;border-radius:6px;background:var(--good);transition:width .35s cubic-bezier(.3,.8,.3,1);position:relative}
.prog i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.qcard{padding:20px 18px 22px}
.qtext{font-size:1.12rem;font-weight:700;line-height:1.6;margin:0 0 16px;text-wrap:pretty}
.qtext .hint{font-weight:500}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;padding:0 .3em}
.opts{display:grid;gap:10px}
.opt{padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);display:flex;gap:12px;align-items:center;line-height:1.5;min-height:54px;font-weight:500;transition:transform .06s,box-shadow .06s,border-color .12s,background .12s}
.opt .l{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font:700 .86rem var(--display);color:var(--muted)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 transparent}
.opt.yes{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good)}
.opt.yes .l{background:var(--good);border-color:var(--good);color:var(--on-good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.opt.no .l{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.opt.used{opacity:.38;box-shadow:none}
.opt:disabled{cursor:default}
.opt:disabled:not(.yes):not(.no):not(.used){opacity:.62;box-shadow:none}
.oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxb{display:grid;place-items:center;height:124px;border-radius:22px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font:800 3.4rem/1 var(--display);text-align:center;transition:transform .06s,box-shadow .06s}

.oxb:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent}
.oxb.yes{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.oxb.no{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.oxb:disabled:not(.yes):not(.no){opacity:.5;box-shadow:none}
.shortf{display:grid;grid-template-columns:1fr auto;gap:8px}

.shortf input:focus{outline:none;border-color:var(--accent)}
.shortf input.yes{border-color:var(--good);background:var(--good-bg)}.shortf input.no{border-color:var(--bad);background:var(--bad-bg)}
.bogi{border:1.5px solid var(--line);border-radius:10px;padding:16px 14px 12px;margin:4px 0 16px;display:grid;gap:6px;font-size:.96rem;line-height:1.65;position:relative;background:var(--surface)}

.fb.ok{background:var(--good-bg)}.fb.ng{background:var(--bad-bg)}
.fb b.v{font-family:var(--display);font-size:1.02rem;font-weight:800}
.fb .ansline{font-weight:500}
.fb .pg{color:var(--muted);font-size:.8rem}
.fb a,.lnk{color:var(--accent);font-weight:700;cursor:pointer;font-size:.85rem}
.onotes{display:grid;gap:4px;margin-top:4px;font-size:.87rem;line-height:1.5}

.seq{display:grid;gap:2px;font-size:.9rem}
.reasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}

.qcard .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;flex-wrap:nowrap;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.qcard .actions:empty{display:none}
.qcard .actions .btn{flex:1 1 0;max-width:360px;min-height:52px;font-size:1.02rem}
.qcard .actions.ok{background:var(--good-bg);border-top-color:transparent}
.qcard .actions.ng{background:var(--bad-bg);border-top-color:transparent}
.verdict{flex:1 1 0;max-width:360px;display:flex;align-items:center;gap:8px;font:800 1.12rem var(--display)}

.ord{display:grid;gap:6px;min-height:36px;margin-bottom:6px}
.ord .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:.93rem}

.ord .it.yes{background:var(--good-bg)}.ord .it.no{background:var(--bad-bg)}

.sortlist{display:grid;gap:8px}
.sortrow{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:.95rem}

.setgrid{display:grid;gap:14px}

.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;box-shadow:var(--shadow);min-width:0}

.mode .k{font:800 .98rem/1.3 var(--display)}

.list{display:grid;gap:8px}

.hbar .b{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:5px;background:var(--uc,var(--accent))}
.hbar .v{font:700 .85rem var(--display);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{display:flex;gap:5px;align-items:flex-end;height:64px}
.spark i{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;position:relative}

.act14 .col.now{color:var(--ink);font-weight:800}
.act14 .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--line);pointer-events:none}
.act14 .goal span{position:absolute;right:0;top:-16px;font:600 .66rem var(--display);color:var(--muted);background:var(--surface);padding-left:4px}
.chain{display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--surface2)}
.step .n{font:800 .9rem var(--display);color:var(--accent)}
.step.d{background:var(--good-bg)}
details.rev{border-radius:12px;background:var(--surface2);padding:11px 14px;font-size:.92rem}
details.rev summary{cursor:pointer;line-height:1.5;font-weight:500}
details.rev.ng summary{color:var(--bad-ink)}details.rev.ok summary{color:var(--good-ink)}
details.rev[open] summary{margin-bottom:12px}
details.rev .quote{margin-top:12px}
.sheetbg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;align-items:end;justify-items:center;animation:fade .15s ease-out both}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:10px;animation:rise .2s ease-out both}
.sheet h2{font-size:1.25rem;margin:0}.sheet p{margin:0 0 8px}
@media (min-width:560px){.sheetbg{align-items:center}.sheet{border-radius:24px;padding-bottom:20px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .24s ease-out both}
@media (max-width:480px){.hbar{grid-template-columns:5.6em 1fr 3em}.today{padding:18px 16px;gap:6px 14px}.mode{padding:12px;gap:10px}.mode .tile{width:38px;height:38px;border-radius:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* 요약 탭: 교과서 소제목 단위 정리. 본문은 점 목록, 자료·용어는 상자, 사료 원문은 명조. */

.sumnav{display:flex;gap:6px;overflow-x:auto;margin:0 -4px;padding:2px 4px;scrollbar-width:none}

.sumnav button{flex:none;font-size:.8rem;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.sumsec{padding:16px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 72px)}

.sumsec h3 .tag{margin:0;background:color-mix(in srgb,var(--uc,var(--accent)) 14%,var(--surface));color:var(--ink)}
.sumsec h3 .pgb{margin-left:auto;font:700 .72rem var(--display);color:var(--muted);white-space:nowrap}

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const view=$('#view'), backBtn=$('#backBtn');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
// ---------- 저장 ----------
const SK='hk_memo_v2';
const freshS=()=>({box:{},due:{},wrong:{},done:{},units:[1,2,3,4,5,6,7,8],stats:{a:0,c:0},byType:{},byTopic:{},exams:[],lastTopic:null,profile:null,daily:{},goal:30});
let S=freshS();
function loadS(p){S={...freshS(),...p};['box','due','wrong','done','byType','byTopic','daily'].forEach(k=>S[k]=S[k]||{});S.exams=S.exams||[];S.units=S.units||[1,2,3,4,5,6,7,8]}
try{const raw=localStorage.getItem(SK);if(raw)loadS(JSON.parse(raw))}catch(e){}
const DAY=86400000, INTERVAL=[0,1,3,7,14];
const now=()=>Date.now();
const isDue=key=>S.due[key]!==undefined&&S.due[key]<=now();
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
// ---------- 데이터 가공 ----------
const topicByPage=p=>{const t=TOPICS.find(t=>p>=t.pages[0]&&p<=t.pages[1]);return t?t.id:null};
const EV=EVENTS.map((e,i)=>({key:'e'+i,unit:e[0],y:e[1],m:e[2],name:e[3],page:e[4],note:e[5],nq:!!(e[6]&&e[6].nq),av:(e[6]&&e[6].av)||[],t:e[1]*12+(e[2]||6),topic:topicByPage(e[4])}));
const EQ=EV.filter(e=>!e.nq);
const SR=SOURCES.map((s,i)=>({key:'s'+i,unit:s[0],title:s[1],year:s[2],text:s[3],page:s[4],topic:topicByPage(s[4])}));
const BL=BLANKS.map((b,i)=>({key:'b'+i,unit:b[0],q:b[1],a:b[2],page:b[3],topic:topicByPage(b[3])}));
const PR=[];TOPICS.forEach(t=>t.pairs.forEach((p,i)=>PR.push({key:'p'+t.id+'_'+i,unit:t.unit,topic:t.id,a:p[0],b:p[1],page:t.pages[0]})));
const unitName=u=>UNITS.find(x=>x.id===u).name;
const topicOf=id=>TOPICS.find(t=>t.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const yl=e=>e.m?`${e.y}.${e.m}`:`${e.y}`;
const kw=s=>esc(s).replace(/==(.+?)==/g,'<mark>$1</mark>');
function weight(key){const b=S.box[key];let w=b===undefined?6:[8,5,3,2,1][Math.min(b,4)];if(isDue(key))w*=2.5;return w}
function pickWeighted(items,n,exclude=new Set()){const out=[];let pool=items.filter(x=>!exclude.has(x.key));while(out.length<n&&pool.length){let tot=pool.reduce((s,x)=>s+weight(x.key),0),r=Math.random()*tot,idx=0;for(;idx<pool.length;idx++){r-=weight(pool[idx].key);if(r<=0)break}idx=Math.min(idx,pool.length-1);out.push(pool[idx]);pool.splice(idx,1)}return out}
// 학습 상태(상자·복습일·오답)만 갱신 — 통계는 stat()에서 문항당 1회
function mark(key,ok,info){const b=S.box[key]||0;const nb=ok?Math.min(b+1,4):0;S.box[key]=nb;S.due[key]=now()+INTERVAL[nb]*DAY;
  if(ok){if(S.wrong[key]&&nb>=2)delete S.wrong[key]}else if(info)S.wrong[key]=info;save()}
function stat(type,topic,ok,diff){S.stats.a++;if(ok)S.stats.c++;
  {const k=dayKey(new Date());S.daily=S.daily||{};const t=S.daily[k]=S.daily[k]||{a:0,c:0};t.a++;if(ok)t.c++}
  if(diff){S.byDiff=S.byDiff||{};const t=S.byDiff[diff]=S.byDiff[diff]||{a:0,c:0};t.a++;if(ok)t.c++}
  if(type){const t=S.byType[type]=S.byType[type]||{a:0,c:0};t.a++;if(ok)t.c++}
  if(topic){const t=S.byTopic[topic]=S.byTopic[topic]||{a:0,c:0};t.a++;if(ok)t.c++}save()}
function grade(key,ok,info,type,topic){mark(key,ok,info);stat(type,topic,ok)}
function selUnits(){return S.units.length?S.units:[1,2,3,4,5,6,7,8]}
// 시험 범위: 프로필(쪽수·제외 주제)이 있으면 그것이, 없으면 선택 단원이 범위
function scopeTopics(){const p=S.profile;if(p&&p.from){return TOPICS.filter(t=>t.pages[1]>=p.from&&t.pages[0]<=p.to&&!(p.excl||[]).includes(t.id)).map(t=>t.id)}return TOPICS.filter(t=>selUnits().includes(t.unit)).map(t=>t.id)}
function scopeLabel(){const p=S.profile;if(p&&p.from)return `${p.name||'시험 범위'} · ${p.from}~${p.to}쪽 · 주제 ${scopeTopics().length}개`;const u=selUnits();return u.length===8?'전체 8단원':u.map(x=>x+'단원').join('·')}
const inScope=x=>scopeTopics().includes(x.topic);
const allItems=()=>[...EV,...SR,...BL,...PR,...OX,...GV,...SQ,...CM];
function dueItems(){const sc=new Set(scopeTopics());return allItems().filter(x=>sc.has(x.topic)&&isDue(x.key))}
const tEvents=t=>EV.filter(e=>e.topic===t).sort((a,b)=>a.t-b.t);
const tSources=t=>SR.filter(s=>s.topic===t);
const tCards=t=>[...PR.filter(p=>p.topic===t).map(p=>({key:p.key,kind:'짝',front:p.a,back:p.b})),...tEvents(t).map(e=>({key:e.key,kind:'연도',front:e.name,back:yl(e),note:e.note})),...BL.filter(b=>b.topic===t).map(b=>({key:b.key,kind:'키워드',front:b.q.replace('___','(      )'),back:b.a}))];
function doneOf(tid){const d=S.done[tid]||{};const srcs=tSources(tid),cards=tCards(tid);
  const src=srcs.length?srcs.every(s=>(S.box[s.key]||0)>=2):true;

function flipDeck(el,cards,t,cat,label){let queue=shuffle(cards).sort((a,b)=>weight(b.key)-weight(a.key));let i=0,flipped=false,streak={};const total=cards.length;

    const c=queue[i];const b=S.box[c.key]||0;const state=b===0&&S.box[c.key]===undefined?'새 카드':b>=2?'안정':'복습 중';
    el.innerHTML=`<div class="card"><div class="qhead"><span>${label} ${i+1} / ${queue.length}</span><span><span class="tag">${c.kind}</span><span class="tag">${state}</span></span></div>

      <div class="actions"><span class="hint" style="margin-right:auto">안정 ${stable()}/${total}</span>${nextCatBtn(t,cat)}</div></div>`;
    $('#fl').onclick=()=>{if(!flipped){flipped=true;r()}};
    if(flipped){$('#ok').onclick=()=>{grade(c.key,true,null,c.kind==='사료'?'source':'card',t.id);streak[c.key]=(streak[c.key]||0)+1;flipped=false;i++;r()};

    bindNext(t)};r()}

   <div class="card"><h2>유형별 정답률</h2>${typeRows.length?typeRows.map(r=>`<div class="hbar"><span>${r.v}</span><span class="b"><i style="width:${r.s.c/r.s.a*100}%"></i></span><span class="v">${Math.round(r.s.c/r.s.a*100)}%</span></div>`).join(''):'<div class="empty">아직 기록이 없습니다.</div>'}</div>
   <div class="card"><h2>난이도별 정답률</h2>${Object.keys(S.byDiff||{}).length?[1,2,3,4,5].filter(d=>(S.byDiff||{})[d]).map(d=>{const v=S.byDiff[d];return `<div class="hbar"><span>${'★'.repeat(d)}</span><span class="b"><i style="width:${v.c/v.a*100}%"></i></span><span class="v">${Math.round(v.c/v.a*100)}%</span></div>`}).join(''):'<div class="empty">아직 기록이 없습니다.</div>'}</div>
   <div class="card"><h2>틀린 이유</h2>${Object.keys(S.reasons||{}).length?(()=>{const m=S.reasons;const mx=Math.max(...Object.values(m));return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar" style="grid-template-columns:9.5em 1fr 3em"><span>${k}</span><span class="b"><i style="width:${v/mx*100}%;background:var(--bad)"></i></span><span class="v">${v}</span></div>`).join('')})():'<div class="empty">오답 해설에서 이유를 고르면 쌓입니다.</div>'}</div>
   <div class="card"><h2>약점 주제 TOP 5</h2>${weak.length?`<div class="list">${weak.map(x=>`<button class="wi" data-t="${x.t.id}" style="text-align:left"><span class="a">${x.t.no}. ${esc(x.t.name)}</span><span class="q">오답 ${x.w}개 · 정답률 ${Math.round(x.r*100)}% · 눌러서 허브로</span></button>`).join('')}</div>`:'<div class="empty">주제당 3문항 이상 풀면 나타납니다.</div>'}</div>
   <div class="card"><h2>실전 점수 추이</h2>${S.exams.length?`<div class="spark" style="margin-top:18px">${S.exams.map(e=>`<i style="height:${Math.max(4,e.score)}%"><span>${e.score}</span></i>`).join('')}</div>`:'<div class="empty">실전 모의고사를 치르면 나타납니다.</div>'}</div>
   <div class="card"><h2>기록 백업</h2><p class="hint">이 기기 브라우저에만 저장되므로, 다른 기기로 옮기거나 지워질 때를 대비해 코드를 복사해 두세요.</p>
    <div class="row"><button class="btn" id="exp">내보내기 (코드 복사)</button><button class="btn" id="imp">불러오기</button></div><div id="bk"></div></div>
   <div class="row"><button class="btn ghost" id="reset">기록 초기화</button></div></div>`;
  $$('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();statsPage()});
  $('#exp').onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const bk=$('#bk');bk.innerHTML=`<textarea id="ta" readonly style="width:100%;height:90px;margin-top:10px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:inherit;padding:8px"></textarea><div class="hint" id="msg"></div>`;$('#ta').value=code;
    try{await navigator.clipboard.writeText(code);$('#msg').textContent='복사했습니다. 메모 앱 등에 붙여 두세요.'}catch(e){$('#ta').select();$('#msg').textContent='자동 복사가 막혀 있습니다. 텍스트를 길게 눌러 복사하세요.'}};
  $('#imp').onclick=()=>{const bk=$('#bk');bk.innerHTML=`<textarea id="ta" placeholder="내보내기 코드를 붙여 넣으세요" style="width:100%;height:90px;margin-top:10px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:inherit;padding:8px"></textarea><div class="actions" style="margin-top:8px"><button class="btn primary" id="doImp">이 기록으로 덮어쓰기</button></div><div class="hint" id="msg"></div>`;
    $('#doImp').onclick=()=>{try{const p=JSON.parse(decodeURIComponent(escape(atob($('#ta').value.trim()))));if(!p||typeof p!=='object'||!p.box)throw 0;loadS(p);save();statsPage()}catch(e){$('#msg').textContent='코드를 읽을 수 없습니다. 내보내기 코드 전체를 정확히 붙여 넣었는지 확인하세요.'}}};
  $$('[data-t]').forEach(b=>b.onclick=()=>openTopic(+b.dataset.t,'sum'));
  $('#reset').onclick=()=>{view.innerHTML=`<div class="card"><h2>기록을 모두 지울까요?</h2><p class="hint">학습 완성도, 카드 상자, 오답, 정답률, 실전 이력이 초기화됩니다. 되돌릴 수 없습니다.</p><div class="actions"><button class="btn" id="c1">취소</button><button class="btn primary" id="c2">초기화</button></div></div>`;$('#c1').onclick=statsPage;$('#c2').onclick=()=>{const u=S.units,p=S.profile;S=freshS();S.units=u;S.profile=p;save();statsPage()}}}
setNav('home');home();
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
</html>
